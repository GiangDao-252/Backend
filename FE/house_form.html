<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự đoán giá nhà</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; max-width: 400px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; font-size: 1.2em; font-weight: bold; color: #28a745; }
        .error { color: red; }
    </style>
</head>
<body>

    <h2>Định giá bất động sản</h2>
    
    <form id="house-form">
        <div class="form-group">
            <label for="area">Diện tích (m²):</label>
            <input type="number" id="area" step="0.1" required placeholder="Ví dụ: 80">
        </div>

        <div class="form-group">
            <label for="bedrooms">Số phòng ngủ:</label>
            <input type="number" id="bedrooms" required placeholder="Ví dụ: 3">
        </div>

        <div class="form-group">
            <label for="location">Khu vực:</label>
            <select id="location">
                <option value="hanoi">hanoi</option>
                <option value="hcmc">hcmc</option>
                <option value="other">other</option>
            </select>
        </div>

        <button type="submit">Dự đoán giá</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById("house-form").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            const area = document.getElementById("area").value;
            const bedrooms = document.getElementById("bedrooms").value;
            const location = document.getElementById("location").value;
            const resultDiv = document.getElementById("result");

            resultDiv.innerText = "Đang tính toán...";
            resultDiv.className = "";

            try {
                // Gọi API bằng URL tương đối (vì frontend và backend chạy chung cổng 8000)
                const url = `http://127.0.0.1:8000/predict?area=${area}&bedrooms=${bedrooms}&location=${location}`;
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error(`Lỗi Server: ${response.status}`);
                }

                const data = await response.json();

                const finalPrice = data.price; 
                
                resultDiv.innerText = "Giá dự đoán: " + finalPrice.toLocaleString("vi-VN") + " VND";
                
            } catch (error) {
                resultDiv.innerText = "Có lỗi xảy ra: " + error.message;
                resultDiv.className = "error";
            }
        });
    </script>
</body>
</html>
